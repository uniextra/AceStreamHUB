services:
  acestream-engine:
    image: jopsis/aceserve:latest
    container_name: acestream-engine
    restart: unless-stopped
    ports:
      - "6878:6878"
      - "8621:8621"
      - "62062:62062"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ./config:/config

  httpaceproxy:
    image: jopsis/httpaceproxy:latest
    container_name: httpaceproxy
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - ACEPROXY_HOST=0.0.0.0
      - ACEPROXY_PORT=8888
      - ACESTREAM_HOST=acestream-engine
      - ACESTREAM_API_PORT=62062
      - ACESTREAM_HTTP_PORT=6878
      - MAX_CONNECTIONS=10
      - MAX_CONCURRENT_CHANNELS=5
      - ENABLED_PLUGINS=newera,elcano,acepl,af1c1onados,aio,stat,statplugin
      - AIO_PLUGINS=newera,elcano,acepl,af1c1onados
      - ACESTREAM_API_PORT=62062
    depends_on:
      - acestream-engine
    
  proxy-app:
    build: .
    container_name: acestream-hdhr-proxy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5004}:${WEB_PORT:-5004}"
    environment:
      - ACESTREAM_URL=http://httpaceproxy:8888
      - DATA_DIR=/app/config
      - WEB_PORT=${WEB_PORT:-5004}
    volumes:
      - ./config:/app/config
    depends_on:
      - acestream-engine
      - httpaceproxy
