services:
  acestream-engine:
    image: vstavrinov/acestream-engine:latest
    container_name: acestream-engine
    restart: unless-stopped
    ports:
      - "6878:6878"
    volumes:
      - ./config:/config
    command: >
      /bin/bash -c "args=$$(cat /config/engine_args.txt 2>/dev/null || echo ''); mkdir -p /dev/shm/.ACEStream; ./start-engine --client-console --bind-all --live-cache-type memory $$args"

  httpaceproxy:
    image: jopsis/httpaceproxy:latest
    container_name: httpaceproxy
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - ACESTREAM_HOST=acestream-engine
      - ACESTREAM_HTTP_PORT=6878
      - ACESTREAM_API_PORT=62062
    depends_on:
      - acestream-engine
    
  proxy-app:
    build: .
    container_name: acestream-hdhr-proxy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5004}:${WEB_PORT:-5004}"
    environment:
      - ACESTREAM_URL=http://httpaceproxy:8888
      - DATA_DIR=/app/config
      - WEB_PORT=${WEB_PORT:-5004}
    volumes:
      - ./config:/app/config
    depends_on:
      - acestream-engine
      - httpaceproxy
